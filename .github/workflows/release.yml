name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel + sdist
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build
      - name: Generate checksums
        run: |
          mkdir -p dist
          cd dist && sha256sum *.whl *.tar.gz > checksums.txt && cd ..
      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  # Optional PyPI trusted-publishing — OFF by default. A fresh repo has no
  # Trusted Publisher registered, so an always-on pypi job fails the FIRST
  # release with invalid-publisher. Set repo variable PYPI_PUBLISH=true AND
  # register the Trusted Publisher when you actually want to ship to PyPI.
  pypi:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - uses: pypa/gh-action-pypi-publish@release/v1
