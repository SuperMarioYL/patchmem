<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
     role="img" aria-label="架构：Session JSONL → Parse+Patch → Resume 2 arms → Influence Diff">
  <defs>
    <marker id="ah-l" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#B9B9C2"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="360" fill="#F5F5F7"/>

  <!-- stage labels (above nodes) -->
  <text x="105" y="108" text-anchor="middle" font-size="11" font-weight="600" fill="#6E6E73">input</text>
  <text x="330" y="108" text-anchor="middle" font-size="11" font-weight="600" fill="#6E6E73">m1 · parse + patch WM</text>
  <text x="555" y="108" text-anchor="middle" font-size="11" font-weight="600" fill="#6E6E73">m2 · resume 2 arms</text>
  <text x="780" y="108" text-anchor="middle" font-size="11" font-weight="600" fill="#6E6E73">m3 · influence diff</text>

  <!-- connectors: static base lines (data direction left→right) -->
  <g stroke="#C9C9D0" stroke-width="1.5" fill="none">
    <line x1="190" y1="180" x2="240" y2="180" marker-end="url(#ah-l)"/>
    <line x1="415" y1="180" x2="465" y2="180" marker-end="url(#ah-l)"/>
    <line x1="640" y1="180" x2="690" y2="180" marker-end="url(#ah-l)"/>
  </g>
  <!-- marching-dash data flow (dasharray 6 10 = 16; from 32→0 = 2 cycles → seamless;
       staggered with negative begin so no startup dead zone) -->
  <g stroke-width="1.5" fill="none" stroke-linecap="round">
    <line x1="190" y1="180" x2="236" y2="180" stroke="#0071E3" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <line x1="415" y1="180" x2="461" y2="180" stroke="#5E5CE6" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-0.8s" repeatCount="indefinite"/>
    </line>
    <line x1="640" y1="180" x2="686" y2="180" stroke="#10A37F" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-1.2s" repeatCount="indefinite"/>
    </line>
  </g>
  <!-- data packet dots travelling along each connector -->
  <g>
    <circle r="3" fill="#0071E3">
      <animateMotion path="M190,180 L236,180" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#5E5CE6">
      <animateMotion path="M415,180 L461,180" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#10A37F">
      <animateMotion path="M640,180 L686,180" dur="2.4s" begin="-0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-0.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- nodes: 4 stages; breathing = fill-opacity 0.10↔0.18 spline, staggered -->
  <g>
    <rect x="20" y="140" width="170" height="80" rx="15" fill="#0071E3" fill-opacity="0.10" stroke="#0071E3" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="105" y="178" text-anchor="middle" font-size="14" font-weight="600" fill="#0A4F9E">Session JSONL</text>
    <text x="105" y="196" text-anchor="middle" font-size="10" fill="#6E6E73">~/.claude/projects</text>

    <rect x="245" y="140" width="170" height="80" rx="15" fill="#5E5CE6" fill-opacity="0.10" stroke="#5E5CE6" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-1.1s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="330" y="178" text-anchor="middle" font-size="14" font-weight="600" fill="#4B3FC4">Parse + Patch</text>
    <text x="330" y="196" text-anchor="middle" font-size="10" fill="#6E6E73">transcript · patch.py</text>

    <rect x="470" y="140" width="170" height="80" rx="15" fill="#10A37F" fill-opacity="0.10" stroke="#10A37F" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-2.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="555" y="178" text-anchor="middle" font-size="14" font-weight="600" fill="#0B6B53">Resume 2 arms</text>
    <text x="555" y="196" text-anchor="middle" font-size="10" fill="#6E6E73">patched + control</text>

    <rect x="695" y="140" width="170" height="80" rx="15" fill="#5E5CE6" fill-opacity="0.10" stroke="#5E5CE6" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-0.4s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="780" y="178" text-anchor="middle" font-size="14" font-weight="600" fill="#4B3FC4">Influence Diff</text>
    <text x="780" y="196" text-anchor="middle" font-size="10" fill="#6E6E73">structural tool_use diff</text>
  </g>

  <!-- footnote: honesty guard -->
  <text x="440" y="288" text-anchor="middle" font-size="11" fill="#6E6E73">diff = replay-ablation (patched vs control), never a model attribution</text>
  <text x="440" y="306" text-anchor="middle" font-size="10" fill="#A1A1A8">one copy mutated, two arms resumed, decisions diffed by id</text>
</svg>
